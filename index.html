<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<link rel="icon" type="image/png" id="dynamicFavicon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #EDE8E1;
  font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
  color: #2A2420;
  transition: background 1.2s ease;
}

/* ── Hamburger ── */
.menu-btn {
  position: fixed; top: 18px; right: 18px;
  width: 42px; height: 42px;
  background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
  border-radius: 13px; border: 1px solid rgba(0,0,0,0.07);
  box-shadow: 0 2px 14px rgba(0,0,0,0.09);
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px; z-index: 200;
  transition: box-shadow 0.2s, transform 0.15s;
}
.menu-btn:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.13); }
.menu-btn:active { transform: scale(0.95); }
.menu-btn span {
  display: block; width: 18px; height: 1.5px;
  background: #3A3530; border-radius: 2px;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* ── Calendar ── */
.cal-overlay {
  position: fixed; inset: 0; background: rgba(30,24,20,0);
  z-index: 150; pointer-events: none; transition: background 0.32s ease;
}
.cal-overlay.open { background: rgba(30,24,20,0.28); pointer-events: auto; }
.cal-panel {
  position: absolute; top: 0; right: 0;
  width: 360px; max-width: 100vw; height: 100%;
  background: #FDFAF6; box-shadow: -8px 0 40px rgba(0,0,0,0.12);
  transform: translateX(100%);
  transition: transform 0.36s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.cal-overlay.open .cal-panel { transform: translateX(0); }
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 22px 14px; border-bottom: 1px solid #EDE8E1;
}
.cal-head h2 { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
.cal-close {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: #EDE8E1; color: #7A7068; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.18s;
}
.cal-close:hover { background: #DDD7CF; }
.cal-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 16px 22px; border-bottom: 1px solid #EDE8E1;
}
.cal-stat { background: #F5F0EB; border-radius: 12px; padding: 12px 14px; }
.stat-label {
  display: block; font-size: 10px; letter-spacing: 1.8px;
  text-transform: uppercase; color: #A89E96; font-weight: 500; margin-bottom: 4px;
}
.stat-value { display: block; font-size: 20px; font-weight: 300; color: #2A2420; font-variant-numeric: tabular-nums; }
.cal-nav {
  display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px;
}
.cal-nav-arrow {
  width: 32px; height: 32px; border: none; background: none; border-radius: 8px;
  color: #7A7068; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s;
}
.cal-nav-arrow:hover { background: #EDE8E1; color: #2A2420; }
.cal-month-label { font-size: 15px; font-weight: 500; color: #2A2420; letter-spacing: 0.3px; }
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7,1fr);
  padding: 0 14px 6px; text-align: center;
}
.cal-weekdays span { font-size: 11px; color: #B0A8A0; font-weight: 500; letter-spacing: 0.5px; padding: 4px 0; }
.cal-weekdays span:first-child { color: #C49090; }
.cal-weekdays span:last-child  { color: #9090C4; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 3px; padding: 0 14px; flex: 1; align-content: start;
}
.cal-day {
  aspect-ratio: 1; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; cursor: default; position: relative; transition: transform 0.12s;
}
.cal-day:hover { transform: scale(1.06); }
.cal-day .day-num  { font-size: 13px; font-weight: 400; color: #2A2420; line-height: 1; }
.cal-day .day-time { font-size: 9px; font-weight: 500; color: #7A9E8A; line-height: 1; letter-spacing: 0.2px; }
.cal-day.lv0 { background: transparent; }
.cal-day.lv1 { background: #D6EAE0; } .cal-day.lv1 .day-num { color: #2A6040; } .cal-day.lv1 .day-time { color: #4A8060; }
.cal-day.lv2 { background: #A3CCBA; } .cal-day.lv2 .day-num { color: #1A4530; } .cal-day.lv2 .day-time { color: #1A4530; }
.cal-day.lv3 { background: #6DAE90; } .cal-day.lv3 .day-num { color: #FAF7F3; } .cal-day.lv3 .day-time { color: #EAF5EF; }
.cal-day.lv4 { background: #4A876C; } .cal-day.lv4 .day-num { color: #FAF7F3; } .cal-day.lv4 .day-time { color: #C5E0D4; }
.cal-day.lv5 { background: #3E5A4C; } .cal-day.lv5 .day-num { color: #FAF7F3; } .cal-day.lv5 .day-time { color: #A8CAB8; }
.cal-day.today::after {
  content: ''; position: absolute; inset: 0;
  border-radius: 10px; border: 2px solid #3E5A4C; pointer-events: none;
}
.cal-day.lv3.today::after,.cal-day.lv4.today::after,.cal-day.lv5.today::after { border-color: rgba(255,255,255,0.6); }
.cal-day.other-month .day-num { color: #C8C2B8; }
.cal-day.other-month { opacity: 0.45; }
.cal-legend {
  display: flex; align-items: center; gap: 5px;
  padding: 14px 22px 20px; justify-content: flex-end;
}
.cal-legend span { font-size: 10px; color: #B0A8A0; letter-spacing: 0.5px; }
.legend-dot { width: 12px; height: 12px; border-radius: 4px; }

/* ── Mode Toggle ── */
.mode-toggle {
  display: flex; width: 300px;
  background: rgba(255,255,255,0.6);
  border: 1px solid #DDD7CF; border-radius: 50px; padding: 3px; gap: 2px;
}
.mode-btn {
  flex: 1;                        /* equal width */
  text-align: center;
  padding: 8px 0;
  border-radius: 50px; border: none; background: none;
  font-size: 13px; font-weight: 500; color: #9B948C;
  cursor: pointer; letter-spacing: 0.2px;
  transition: color 0.2s, background 0.22s cubic-bezier(0.4,0,0.2,1), box-shadow 0.22s;
}
.mode-btn:hover { color: #2A2420; }
.mode-btn.active {
  background: #3E5A4C; color: #FAF7F3; font-weight: 600;
  box-shadow: 0 1px 8px rgba(62,90,76,0.30);
}

/* ── Main ── */
.wrap { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.clock-outer {
  position: relative; width: 300px; height: 300px;
  filter: drop-shadow(0 6px 24px rgba(0,0,0,0.09));
}
#clockSvg { width: 300px; height: 300px; }
.center-text {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; pointer-events: none;
}
.time-text {
  font-size: 54px; font-weight: 200; letter-spacing: 2px;
  font-variant-numeric: tabular-nums; color: #2A2420;
  transition: color 0.4s, font-size 0.2s;
}

/* ── Controls ── */
.controls { display: flex; flex-direction: column; align-items: center; width: 300px; }
#timerControls {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px;
  overflow: hidden; max-height: 200px; opacity: 1; margin-bottom: 18px;
  transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1), opacity 0.25s, margin-bottom 0.38s cubic-bezier(0.4,0,0.2,1);
}
#timerControls.hidden { max-height: 0; opacity: 0; margin-bottom: 0; pointer-events: none; }
.presets { display: flex; gap: 8px; width: 100%; }
.preset-btn {
  flex: 1; padding: 10px 0; border-radius: 50px;
  border: 1.5px solid #C4BDB5; background: transparent;
  color: #6A6059; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.18s;
}
.preset-btn:hover  { border-color: #3E5A4C; color: #3E5A4C; }
.preset-btn.active { background: #3E5A4C; border-color: #3E5A4C; color: #FAF7F3; }
.custom-row { display: flex; align-items: flex-end; gap: 4px; }
.custom-row input {
  width: 42px; background: none; border: none; border-bottom: 1.5px solid #C4BDB5;
  color: #2A2420; font-size: 24px; font-weight: 300; text-align: center;
  padding: 0 0 3px; outline: none; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; transition: border-color 0.2s;
}
.custom-row input::-webkit-inner-spin-button,
.custom-row input::-webkit-outer-spin-button { display: none; }
.custom-row input:focus { border-color: #3E5A4C; }
.custom-row .unit  { font-size: 12px; color: #A89E96; padding-bottom: 5px; margin-left: 1px; }
.custom-row .colon { font-size: 20px; font-weight: 200; color: #C4BDB5; padding-bottom: 3px; margin: 0 4px; }
.actions { display: flex; gap: 10px; width: 100%; }
#startBtn {
  flex: 1; padding: 13px 0; border-radius: 50px; border: none;
  background: #3E5A4C; color: #FAF7F3; font-size: 14px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.5px;
  transition: background 0.35s, opacity 0.15s, transform 0.1s;
}
#resetBtn {
  padding: 13px 22px; border-radius: 50px; border: none;
  background: #DDD7CF; color: #5A524A; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
button:hover  { opacity: 0.82; }
button:active { transform: scale(0.96); }
.menu-btn:active,.cal-close:active,.cal-nav-arrow:active { transform: scale(0.95) !important; }

/* ── Today Box ── */
.today-box {
  display: flex; align-items: center; justify-content: space-between;
  width: 300px; padding: 14px 20px;
  background: rgba(255,255,255,0.55); border-radius: 16px; border: 1px solid #DDD7CF;
}
.today-left { display: flex; flex-direction: column; gap: 2px; }
.today-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #A89E96; font-weight: 500; }
.today-value { font-size: 22px; font-weight: 300; color: #2A2420; font-variant-numeric: tabular-nums; }
.today-clear {
  font-size: 11px; color: #C4BDB5; background: none; border: none;
  cursor: pointer; padding: 4px 0; letter-spacing: 0.5px; transition: color 0.2s;
}
.today-clear:hover { color: #A85A42; opacity: 1; }
.today-clear:active { transform: none !important; }

/* Done state */
.done #startBtn          { background: #A85A42; }
.done .time-text         { color: #A85A42; }
.done .preset-btn.active { background: #A85A42; border-color: #A85A42; }
</style>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="カレンダーを開く">
  <span></span><span></span><span></span>
</button>

<div class="cal-overlay" id="calOverlay">
  <div class="cal-panel">
    <div class="cal-head">
      <h2>学習カレンダー</h2>
      <button class="cal-close" id="calClose">✕</button>
    </div>
    <div class="cal-stats">
      <div class="cal-stat"><span class="stat-label">今月の合計</span><span class="stat-value" id="statMonthTotal">—</span></div>
      <div class="cal-stat"><span class="stat-label">学習した日</span><span class="stat-value" id="statStudyDays">—</span></div>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-arrow" id="prevMonth">&#8249;</button>
      <span class="cal-month-label" id="monthLabel"></span>
      <button class="cal-nav-arrow" id="nextMonth">&#8250;</button>
    </div>
    <div class="cal-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span>少</span>
      <div class="legend-dot" style="background:#D6EAE0"></div>
      <div class="legend-dot" style="background:#A3CCBA"></div>
      <div class="legend-dot" style="background:#6DAE90"></div>
      <div class="legend-dot" style="background:#4A876C"></div>
      <div class="legend-dot" style="background:#3E5A4C"></div>
      <span>多</span>
    </div>
  </div>
</div>

<div class="wrap" id="wrap">

  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="timer">タイマー</button>
    <button class="mode-btn" data-mode="stopwatch">ストップウォッチ</button>
  </div>

  <div class="clock-outer">
    <svg id="clockSvg" viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="148" fill="white"/>
      <!-- Timer track + ring (hidden in SW mode) -->
      <circle id="mainTrack" cx="150" cy="150" r="116"
              fill="none" stroke="#E4DDD6" stroke-width="32"/>
      <path id="ring" fill="none" stroke="#3E5A4C" stroke-width="32" stroke-linecap="round"/>
      <!-- Stopwatch multi-rings (built dynamically) -->
      <g id="swRings"></g>
      <!-- Shared anchor dot -->
      <circle id="anchorDot" cx="150" cy="34" r="6" fill="#3E5A4C"/>
      <circle cx="150" cy="150" r="148" fill="none" stroke="#DDD7CF" stroke-width="1"/>
    </svg>
    <div class="center-text">
      <div class="time-text" id="timeText">05:00</div>
    </div>
  </div>

  <div class="controls">
    <div id="timerControls">
      <div class="presets">
        <button class="preset-btn" data-min="10" data-sec="0">10分</button>
        <button class="preset-btn" data-min="25" data-sec="0">25分</button>
        <button class="preset-btn" data-min="60" data-sec="0">60分</button>
      </div>
      <div class="custom-row">
        <input type="number" id="minInput" value="5" min="0" max="99" inputmode="numeric"/>
        <span class="unit">分</span>
        <span class="colon">:</span>
        <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric"/>
        <span class="unit">秒</span>
      </div>
    </div>
    <div class="actions">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="today-box">
    <div class="today-left">
      <span class="today-label">今日の学習</span>
      <span class="today-value" id="todayValue">0分</span>
    </div>
    <button class="today-clear" id="todayClear">クリア</button>
  </div>

</div>

<script>
// ═══════════════════════════════════
// HISTORY
// ═══════════════════════════════════
const HISTORY_KEY = 'circleTimerDays';

function dateKey(d) {
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); } catch { return {}; } }
function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }

function addSeconds(sec) {
  if (!sec || sec <= 0) return;
  const h = loadHistory();
  h[dateKey()] = (h[dateKey()] || 0) + sec;
  saveHistory(h);
  renderTodayBox();
}
function clearToday() {
  const h = loadHistory(); delete h[dateKey()]; saveHistory(h); renderTodayBox();
}

// Format helpers
function fmtDur(sec) {
  if (!sec || sec <= 0) return '0分';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}時間${m}分`;   // always show minutes
  if (m > 0) return `${m}分`;
  return `${sec}秒`;
}
function fmtDurShort(sec) {
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}h${m > 0 ? m+'m' : ''}`;
  if (m > 0) return `${m}分`;
  return `${sec}秒`;
}
function intensityLevel(sec) {
  if (!sec || sec <= 0) return 0;
  if (sec < 900)  return 1;
  if (sec < 1800) return 2;
  if (sec < 3600) return 3;
  if (sec < 7200) return 4;
  return 5;
}

// Returns seconds elapsed in the current active session (not yet saved)
function currentSessionSec() {
  if (currentMode === 'timer') {
    if (timerState === 'running')
      return Math.round(Math.min(baseMs + (performance.now() - startTs), totalMs) / 1000);
    if (timerState === 'paused')
      return Math.round(Math.min(baseMs, totalMs) / 1000);
  } else {
    if (swState === 'running')
      return Math.round((swBaseMs + (performance.now() - swStartTs)) / 1000);
    if (swState === 'paused')
      return Math.round(swBaseMs / 1000);
  }
  return 0;
}

function renderTodayBox() {
  const h = loadHistory();
  const total = (h[dateKey()] || 0) + currentSessionSec();
  document.getElementById('todayValue').textContent = fmtDur(total);
}

// Refresh today box every second while a session is running
setInterval(() => {
  if (timerState === 'running' || swState === 'running') renderTodayBox();
}, 1000);

document.getElementById('todayClear').addEventListener('click', () => {
  if (!confirm('今日の学習記録をクリアしますか？')) return;
  clearToday();
});

// ═══════════════════════════════════
// CALENDAR
// ═══════════════════════════════════
let calYear, calMonth;

function openCalendar() {
  const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
  renderCalendar();
  document.getElementById('calOverlay').classList.add('open');
  document.getElementById('menuBtn').classList.add('open');
}
function closeCalendar() {
  document.getElementById('calOverlay').classList.remove('open');
  document.getElementById('menuBtn').classList.remove('open');
}
document.getElementById('menuBtn').addEventListener('click', () =>
  document.getElementById('calOverlay').classList.contains('open') ? closeCalendar() : openCalendar()
);
document.getElementById('calClose').addEventListener('click', closeCalendar);
document.getElementById('calOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('calOverlay')) closeCalendar();
});
document.getElementById('prevMonth').addEventListener('click', () => {
  if (--calMonth < 0) { calMonth = 11; calYear--; } renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  if (++calMonth > 11) { calMonth = 0; calYear++; } renderCalendar();
});

function renderCalendar() {
  const h = loadHistory(), today = dateKey();
  document.getElementById('monthLabel').textContent = `${calYear}年${calMonth + 1}月`;
  let monthSec = 0, studyDays = 0;
  Object.entries(h).forEach(([k, v]) => {
    const d = new Date(k + 'T00:00:00');
    if (d.getFullYear() === calYear && d.getMonth() === calMonth) { monthSec += v; studyDays++; }
  });
  document.getElementById('statMonthTotal').textContent = fmtDur(monthSec);
  document.getElementById('statStudyDays').textContent  = `${studyDays}日`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    const c = makeCell(prevDays - i, false, false, 0); c.classList.add('other-month'); grid.appendChild(c);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(new Date(calYear, calMonth, d));
    grid.appendChild(makeCell(d, true, key === today, h[key] || 0));
  }
  const trailing = (firstDay + daysInMonth) % 7;
  for (let d = 1; d <= (trailing === 0 ? 0 : 7 - trailing); d++) {
    const c = makeCell(d, false, false, 0); c.classList.add('other-month'); grid.appendChild(c);
  }
}
function makeCell(day, inMonth, isToday, sec) {
  const cell = document.createElement('div');
  cell.className = `cal-day lv${inMonth ? intensityLevel(sec) : 0}`;
  if (isToday) cell.classList.add('today');
  const n = document.createElement('span'); n.className = 'day-num'; n.textContent = day;
  cell.appendChild(n);
  if (inMonth && sec > 0) {
    const t = document.createElement('span'); t.className = 'day-time'; t.textContent = fmtDurShort(sec);
    cell.appendChild(t);
  }
  return cell;
}

// ═══════════════════════════════════
// RING — TIMER MODE
// ═══════════════════════════════════
const CX = 150, CY = 150, R = 116;
const ringEl    = document.getElementById('ring');
const anchorDot = document.getElementById('anchorDot');
const mainTrack = document.getElementById('mainTrack');

function setRingTimer(f) {
  f = Math.max(0, Math.min(1, f));
  const elapsed = 1 - f;
  const pAngle = -Math.PI/2 + elapsed * 2 * Math.PI;
  const px = CX + R * Math.cos(pAngle), py = CY + R * Math.sin(pAngle);
  anchorDot.setAttribute('cx', CX); anchorDot.setAttribute('cy', CY - R);
  anchorDot.setAttribute('fill', '#3E5A4C');
  anchorDot.style.opacity = f > 0.001 ? '1' : '0';
  if (f >= 0.9999) {
    ringEl.setAttribute('d', `M ${CX} ${CY-R} A ${R} ${R} 0 1 1 ${CX} ${CY+R} A ${R} ${R} 0 1 1 ${CX} ${CY-R}`);
    return;
  }
  if (f <= 0.0001) { ringEl.setAttribute('d', ''); return; }
  const la = f > 0.5 ? 1 : 0;
  ringEl.setAttribute('d', `M ${px} ${py} A ${R} ${R} 0 ${la} 1 ${CX} ${CY-R}`);
}

// ═══════════════════════════════════
// RING — STOPWATCH MODE (multi-layer)
// ═══════════════════════════════════
const SW_COLORS     = ['#3E5A4C', '#D4A843', '#C47A50', '#7A70A0'];
const SW_OUTER      = 132;  // outermost edge (R+16)
const SW_TOTAL_W    = 32;   // total track width
const swRingsGroup  = document.getElementById('swRings');

let swRingN = 0; // tracks how many rings are currently built

function svgEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

function rebuildSWRings(n) {
  swRingsGroup.innerHTML = '';
  const sw = SW_TOTAL_W / n;
  for (let i = 0; i < n; i++) {
    const r = SW_OUTER - sw * (i + 0.5);
    // Track
    const track = svgEl('circle');
    track.setAttribute('cx', CX); track.setAttribute('cy', CY); track.setAttribute('r', r);
    track.setAttribute('fill', 'none'); track.setAttribute('stroke', '#E4DDD6');
    track.setAttribute('stroke-width', sw);
    swRingsGroup.appendChild(track);
    // Progress
    const path = svgEl('path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', SW_COLORS[Math.min(i, SW_COLORS.length - 1)]);
    path.setAttribute('stroke-width', sw);
    path.setAttribute('stroke-linecap', 'round');
    path.classList.add('sw-progress');
    swRingsGroup.appendChild(path);
  }
  swRingN = n;
}

function arcPath(r, frac) {
  if (frac >= 0.9999) return `M ${CX} ${CY-r} A ${r} ${r} 0 1 1 ${CX} ${CY+r} A ${r} ${r} 0 1 1 ${CX} ${CY-r}`;
  if (frac <= 0.0001) return '';
  const a = -Math.PI/2 + frac * 2 * Math.PI;
  const ex = CX + r * Math.cos(a), ey = CY + r * Math.sin(a);
  return `M ${CX} ${CY-r} A ${r} ${r} 0 ${frac > 0.5 ? 1 : 0} 1 ${ex} ${ey}`;
}

function updateSWRings(totalMs) {
  const totalHours = Math.floor(totalMs / 3600000);
  const n = totalHours + 1;
  if (n !== swRingN) rebuildSWRings(n);

  const sw = SW_TOTAL_W / n;
  const curFrac = (totalMs % 3600000) / 3600000;
  const paths = swRingsGroup.querySelectorAll('.sw-progress');

  paths.forEach((path, i) => {
    const r = SW_OUTER - sw * (i + 0.5);
    path.setAttribute('d', arcPath(r, i < totalHours ? 1 : curFrac));
  });

  // Anchor dot at tip of the innermost (active) ring
  const curR = SW_OUTER - sw * (n - 0.5);
  const dotA = -Math.PI/2 + curFrac * 2 * Math.PI;
  anchorDot.setAttribute('cx', CX + curR * Math.cos(dotA));
  anchorDot.setAttribute('cy', CY + curR * Math.sin(dotA));
  anchorDot.setAttribute('fill', SW_COLORS[Math.min(n - 1, SW_COLORS.length - 1)]);
  anchorDot.style.opacity = curFrac > 0.001 ? '1' : '0';
}

// ═══════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════
const BG_NORMAL = '#EDE8E1', BG_WARN = '#F5EDD0', BG_ALERT = '#F0D5CC';
function updateBg(f) {
  if (currentMode !== 'timer') return;
  const bg = f <= 0.10 ? BG_ALERT : f <= 0.25 ? BG_WARN : BG_NORMAL;
  if (document.body.style.background !== bg) document.body.style.background = bg;
}

// ═══════════════════════════════════
// FAVICON + TAB TITLE
// ═══════════════════════════════════
const _fvC = document.createElement('canvas');
_fvC.width = _fvC.height = 128;
const _fvX  = _fvC.getContext('2d');
const _fvLk = document.getElementById('dynamicFavicon');
let _fvBlob = null, _fvLastSec = -1;

function drawFavicon(ms, total, st) {
  const cx = 64, cy = 64;
  _fvX.clearRect(0, 0, 128, 128);
  let frac;
  if (st === 'sw-running' || st === 'sw-paused') frac = (ms % 3600000) / 3600000;
  else frac = total > 0 ? Math.max(0, Math.min(1, ms / total)) : 1;

  _fvX.beginPath(); _fvX.arc(cx, cy, 62, 0, Math.PI*2); _fvX.fillStyle = '#FDFAF6'; _fvX.fill();

  const color = st === 'done' ? '#A85A42' : '#3E5A4C';
  if (frac > 0.001) {
    _fvX.beginPath(); _fvX.moveTo(cx, cy);
    if (frac >= 0.999) {
      _fvX.arc(cx, cy, 58, 0, Math.PI*2, false);
    } else if (st === 'sw-running' || st === 'sw-paused') {
      _fvX.lineTo(cx, cy-58);
      _fvX.arc(cx, cy, 58, -Math.PI/2, -Math.PI/2 + frac*2*Math.PI, false);
    } else {
      const sa = -Math.PI/2 + (1-frac)*2*Math.PI;
      _fvX.arc(cx, cy, 58, sa, -Math.PI/2, false);
    }
    _fvX.closePath(); _fvX.fillStyle = color; _fvX.fill();
  }
  _fvX.beginPath(); _fvX.arc(cx, cy, 26, 0, Math.PI*2); _fvX.fillStyle = '#FDFAF6'; _fvX.fill();
  _fvX.beginPath(); _fvX.arc(cx, cy, 62, 0, Math.PI*2); _fvX.strokeStyle = '#DDD7CF'; _fvX.lineWidth = 2; _fvX.stroke();

  let label = '', fontSize = 17;
  _fvX.fillStyle = st === 'done' ? '#A85A42' : '#2A2420';
  if (st === 'done') { label = '✓'; fontSize = 26; }
  else if (st !== 'idle') {
    const sec = st === 'sw-running' || st === 'sw-paused'
      ? Math.floor(Math.max(0, ms) / 1000)
      : Math.ceil(Math.max(0, ms) / 1000);
    const m = Math.floor(sec / 60) % 60, s = sec % 60;
    label = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    fontSize = label.length > 4 ? 13 : 16;
  }
  if (label) {
    _fvX.font = `600 ${fontSize}px -apple-system,"Helvetica Neue",monospace`;
    _fvX.textAlign = 'center'; _fvX.textBaseline = 'middle';
    _fvX.fillText(label, cx, cy+1);
  }
  _fvC.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    _fvLk.href = url; if (_fvBlob) URL.revokeObjectURL(_fvBlob); _fvBlob = url;
  }, 'image/png');
}

function updateTab(ms, total, st) {
  const sec = (st === 'sw-running' || st === 'sw-paused')
    ? Math.floor(Math.max(0, ms) / 1000)
    : Math.ceil(Math.max(0, ms) / 1000);
  if (sec === _fvLastSec && st !== 'done' && st !== 'idle') return;
  _fvLastSec = sec; drawFavicon(ms, total, st);
  if (st === 'idle') { document.title = 'Circle Timer'; return; }
  if (st === 'done') { document.title = '✓ 完了 | Circle Timer'; return; }
  const m = Math.floor(sec / 60), s = sec % 60;
  const prefix = (st === 'paused' || st === 'sw-paused') ? '⏸' : '⏱';
  document.title = `${prefix} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} | Circle Timer`;
}

// ═══════════════════════════════════
// MODE
// ═══════════════════════════════════
let currentMode = 'timer';
const timeText  = document.getElementById('timeText');
const startBtn  = document.getElementById('startBtn');
const resetBtn  = document.getElementById('resetBtn');
const minInput  = document.getElementById('minInput');
const secInput  = document.getElementById('secInput');
const wrap      = document.getElementById('wrap');
const presetBtns = document.querySelectorAll('.preset-btn');
const timerCtrl  = document.getElementById('timerControls');

function setTimeDisplay(text) {
  timeText.textContent = text;
  timeText.style.fontSize = text.length > 5 ? '40px' : '54px';
}

document.querySelectorAll('.mode-btn').forEach(btn =>
  btn.addEventListener('click', () => switchMode(btn.dataset.mode))
);

function switchMode(mode) {
  if (mode === currentMode) return;
  // Stop running sessions and save elapsed
  if (currentMode === 'timer') {
    if (timerState === 'running' || timerState === 'paused') {
      const elapsed = timerState === 'running'
        ? baseMs + (performance.now() - startTs) : baseMs;
      if (elapsed >= 30000) addSeconds(Math.round(Math.min(elapsed, totalMs) / 1000));
    }
    cancelAnimationFrame(rafId); timerState = 'idle';
    wrap.classList.remove('done'); document.body.style.background = BG_NORMAL;
    baseMs = 0; startTs = null;
  } else {
    const total = swState === 'running'
      ? swBaseMs + (performance.now() - swStartTs) : swBaseMs;
    if (total >= 60000) addSeconds(Math.round(total / 1000));
    cancelAnimationFrame(swRafId); swBaseMs = 0; swStartTs = null; swState = 'idle';
  }
  currentMode = mode; _fvLastSec = -1;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
  timerCtrl.classList.toggle('hidden', mode === 'stopwatch');
  startBtn.textContent = 'スタート';

  if (mode === 'timer') {
    mainTrack.style.display = ''; ringEl.style.display = '';
    swRingsGroup.innerHTML = ''; swRingN = 0;
    anchorDot.setAttribute('cx', CX); anchorDot.setAttribute('cy', CY - R);
    anchorDot.setAttribute('fill', '#3E5A4C');
    setRingTimer(1); updateBg(1);
    const m = parseInt(minInput.value)||0, s = parseInt(secInput.value)||0;
    setTimeDisplay(fmt((m*60+s)*1000));
    refreshPresetActive();
  } else {
    mainTrack.style.display = 'none'; ringEl.style.display = 'none';
    anchorDot.style.opacity = '0';
    updateSWRings(0);
    setTimeDisplay('00:00');
  }
  updateTab(0, 0, 'idle'); renderTodayBox();
}

// ═══════════════════════════════════
// TIMER
// ═══════════════════════════════════
let totalMs = 0, startTs = null, baseMs = 0, rafId = null;
let timerState = 'idle';

function fmt(ms) {
  const t = Math.ceil(Math.max(0, ms) / 1000);
  return `${String(Math.floor(t / 60)).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
}

function timerTick(now) {
  const elapsed = baseMs + (now - startTs);
  const remaining = totalMs - elapsed;
  if (remaining <= 0) {
    setRingTimer(0); updateBg(0); setTimeDisplay('00:00'); timerDone(); return;
  }
  const frac = remaining / totalMs;
  setRingTimer(frac); updateBg(frac);
  updateTab(remaining, totalMs, 'running');
  setTimeDisplay(fmt(remaining));
  rafId = requestAnimationFrame(timerTick);
}

function timerDone() {
  cancelAnimationFrame(rafId); timerState = 'done';
  wrap.classList.add('done'); startBtn.textContent = 'もう一度';
  addSeconds(Math.round(totalMs / 1000));
  updateTab(0, totalMs, 'done');
}

function timerStartPause() {
  if (timerState === 'idle' || timerState === 'done') {
    wrap.classList.remove('done');
    const m = parseInt(minInput.value)||0, s = parseInt(secInput.value)||0;
    totalMs = (m*60+s)*1000; if (!totalMs) return;
    baseMs = 0; timerState = 'running'; startBtn.textContent = '一時停止';
    setRingTimer(1); rafId = requestAnimationFrame(ts => { startTs = ts; timerTick(ts); });
  } else if (timerState === 'running') {
    cancelAnimationFrame(rafId); baseMs += performance.now() - startTs;
    timerState = 'paused'; startBtn.textContent = '再開';
    updateTab(totalMs - baseMs, totalMs, 'paused'); renderTodayBox();
  } else if (timerState === 'paused') {
    timerState = 'running'; startBtn.textContent = '一時停止'; _fvLastSec = -1;
    rafId = requestAnimationFrame(ts => { startTs = ts; timerTick(ts); });
  }
}

function timerReset() {
  // Save elapsed if session was meaningful
  if (timerState === 'running' || timerState === 'paused') {
    const elapsed = timerState === 'running'
      ? baseMs + (performance.now() - startTs) : baseMs;
    if (elapsed >= 30000) addSeconds(Math.round(Math.min(elapsed, totalMs) / 1000));
  }
  cancelAnimationFrame(rafId); baseMs = 0; startTs = null; timerState = 'idle';
  wrap.classList.remove('done'); startBtn.textContent = 'スタート';
  setRingTimer(1); updateBg(1); _fvLastSec = -1; updateTab(0, 0, 'idle');
  const m = parseInt(minInput.value)||0, s = parseInt(secInput.value)||0;
  setTimeDisplay(fmt((m*60+s)*1000)); renderTodayBox();
}

function applyTime(min, sec) {
  minInput.value = min; secInput.value = sec;
  if (timerState === 'idle') { setTimeDisplay(fmt((min*60+sec)*1000)); setRingTimer(1); }
  refreshPresetActive();
}
function refreshPresetActive() {
  const m = parseInt(minInput.value)||0, s = parseInt(secInput.value)||0;
  presetBtns.forEach(btn =>
    btn.classList.toggle('active', parseInt(btn.dataset.min)===m && parseInt(btn.dataset.sec)===s)
  );
}
presetBtns.forEach(btn => btn.addEventListener('click', () => {
  applyTime(parseInt(btn.dataset.min), parseInt(btn.dataset.sec));
  if (timerState !== 'idle') timerReset();
}));
minInput.addEventListener('input', () => {
  if (timerState === 'idle') {
    setTimeDisplay(fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000));
    refreshPresetActive();
  }
});
secInput.addEventListener('input', () => {
  if (timerState === 'idle') {
    setTimeDisplay(fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000));
    refreshPresetActive();
  }
});

// ═══════════════════════════════════
// STOPWATCH
// ═══════════════════════════════════
let swBaseMs = 0, swStartTs = null, swRafId = null;
let swState = 'idle';

function fmtSW(ms) {
  const t = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function swTick(now) {
  const total = swBaseMs + (now - swStartTs);
  updateSWRings(total);
  setTimeDisplay(fmtSW(total));
  updateTab(total, -1, 'sw-running');
  swRafId = requestAnimationFrame(swTick);
}

function swStartPause() {
  if (swState === 'idle' || swState === 'paused') {
    swState = 'running'; startBtn.textContent = '一時停止'; _fvLastSec = -1;
    swRafId = requestAnimationFrame(ts => { swStartTs = ts; swTick(ts); });
  } else if (swState === 'running') {
    cancelAnimationFrame(swRafId);
    swBaseMs += performance.now() - swStartTs;
    swState = 'paused'; startBtn.textContent = '再開';
    updateTab(swBaseMs, -1, 'sw-paused'); renderTodayBox();
  }
}

function swReset() {
  const total = swState === 'running'
    ? swBaseMs + (performance.now() - swStartTs) : swBaseMs;
  cancelAnimationFrame(swRafId);
  if (total >= 60000) addSeconds(Math.round(total / 1000));
  swBaseMs = 0; swStartTs = null; swState = 'idle';
  startBtn.textContent = 'スタート'; _fvLastSec = -1;
  swRingsGroup.innerHTML = ''; swRingN = 0;
  updateSWRings(0);
  setTimeDisplay('00:00'); updateTab(0, 0, 'idle'); renderTodayBox();
}

// ═══════════════════════════════════
// BUTTON HANDLERS
// ═══════════════════════════════════
startBtn.addEventListener('click', () =>
  currentMode === 'timer' ? timerStartPause() : swStartPause()
);
resetBtn.addEventListener('click', () =>
  currentMode === 'timer' ? timerReset() : swReset()
);

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
setRingTimer(1); refreshPresetActive(); renderTodayBox(); updateTab(0, 0, 'idle');
setTimeDisplay(fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000));
</script>
</body>
</html>
