<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EDE8E1;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #2A2420;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  /* ---- Clock ---- */
  .clock-outer {
    position: relative;
    width: 300px;
    height: 300px;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.10));
  }

  #clockSvg {
    width: 300px;
    height: 300px;
    overflow: visible;
  }

  .center-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    pointer-events: none;
  }

  .time-display {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.4s;
    color: #2A2420;
  }

  .status {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #9B948C;
    font-weight: 500;
  }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .time-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #9B948C;
    font-size: 13px;
  }

  .time-inputs input {
    width: 62px;
    padding: 8px 6px;
    background: #FAF7F3;
    border: 1px solid #DDD7CF;
    border-radius: 10px;
    color: #2A2420;
    font-size: 20px;
    font-weight: 300;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  .time-inputs input::-webkit-inner-spin-button,
  .time-inputs input::-webkit-outer-spin-button { display: none; }

  .time-inputs input:focus { border-color: #7A9E8A; }

  .colon {
    font-size: 22px;
    font-weight: 300;
    color: #BFB9B0;
    margin: 0 2px;
  }

  .buttons { display: flex; gap: 10px; }

  button {
    padding: 10px 28px;
    border-radius: 50px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
  }

  button:hover  { opacity: 0.82; }
  button:active { transform: scale(0.96); }

  #startBtn {
    background: #3E5A4C;
    color: #FAF7F3;
    min-width: 100px;
    transition: background 0.4s;
  }

  #resetBtn {
    background: #DDD7CF;
    color: #5A524A;
  }

  /* done state */
  .done #startBtn { background: #A85A42; }
  .done .time-display { color: #A85A42; }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="clock-outer">
    <svg id="clockSvg" viewBox="0 0 300 300">
      <!-- White face -->
      <circle cx="150" cy="150" r="148" fill="#FDFAF6"/>

      <!-- Colored sector (remaining time, filled) -->
      <path id="sector" fill="#3E5A4C"/>

      <!-- Tick marks drawn by JS -->
      <g id="ticks"></g>

      <!-- Thin border ring -->
      <circle cx="150" cy="150" r="148" fill="none" stroke="#DDD7CF" stroke-width="1"/>

      <!-- Center hub -->
      <circle cx="150" cy="150" r="22" fill="#FDFAF6" stroke="#DDD7CF" stroke-width="1"/>

      <!-- Pointer line -->
      <line id="pointer" x1="150" y1="150" x2="150" y2="4"
            stroke="#FDFAF6" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <div class="center-text">
      <div class="time-display" id="timeDisplay">05:00</div>
      <div class="status" id="status">準備完了</div>
    </div>
  </div>

  <div class="controls">
    <div class="time-inputs">
      <input type="number" id="minInput" value="5" min="0" max="99" inputmode="numeric"/>
      <label>分</label>
      <span class="colon">:</span>
      <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric"/>
      <label>秒</label>
    </div>
    <div class="buttons">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>
</div>

<script>
  const CX = 150, CY = 150, R = 126; // sector radius

  // ---- Draw tick marks ----
  const tickG = document.getElementById('ticks');
  for (let i = 0; i < 60; i++) {
    // Ticks go counterclockwise (matching Time Timer layout)
    const angle = -Math.PI / 2 - (i / 60) * 2 * Math.PI;
    const isMajor = i % 5 === 0;
    const outerR = 140;
    const innerR = isMajor ? 128 : 133;
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', CX + innerR * Math.cos(angle));
    ln.setAttribute('y1', CY + innerR * Math.sin(angle));
    ln.setAttribute('x2', CX + outerR * Math.cos(angle));
    ln.setAttribute('y2', CY + outerR * Math.sin(angle));
    ln.setAttribute('stroke', '#C8C2B8');
    ln.setAttribute('stroke-width', isMajor ? '2' : '1');
    ln.setAttribute('stroke-linecap', 'round');
    tickG.appendChild(ln);
  }

  // ---- Sector drawing ----
  const sectorEl  = document.getElementById('sector');
  const pointerEl = document.getElementById('pointer');

  function setSector(remainingFraction) {
    const f = Math.max(0, Math.min(1, remainingFraction));
    const elapsed = 1 - f;
    const pAngle = -Math.PI / 2 + elapsed * 2 * Math.PI;
    const px = CX + R * Math.cos(pAngle);
    const py = CY + R * Math.sin(pAngle);

    // Update pointer
    pointerEl.setAttribute('x2', px);
    pointerEl.setAttribute('y2', py);

    if (f >= 0.9999) {
      // Full circle: two semicircles
      sectorEl.setAttribute('d',
        `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX} ${CY + R} A ${R} ${R} 0 1 1 ${CX} ${CY - R} Z`
      );
      pointerEl.setAttribute('x2', CX);
      pointerEl.setAttribute('y2', CY - R);
      return;
    }
    if (f <= 0.0001) {
      sectorEl.setAttribute('d', '');
      pointerEl.setAttribute('x2', CX);
      pointerEl.setAttribute('y2', CY - R);
      return;
    }

    // Arc from pointer position, clockwise, to 12 o'clock
    const largeArc = f > 0.5 ? 1 : 0;
    sectorEl.setAttribute('d',
      `M ${CX} ${CY} L ${px} ${py} A ${R} ${R} 0 ${largeArc} 1 ${CX} ${CY - R} Z`
    );
  }

  // ---- Timer state ----
  const timeDisplay = document.getElementById('timeDisplay');
  const statusEl   = document.getElementById('status');
  const startBtn   = document.getElementById('startBtn');
  const resetBtn   = document.getElementById('resetBtn');
  const minInput   = document.getElementById('minInput');
  const secInput   = document.getElementById('secInput');
  const wrap       = document.getElementById('wrap');

  let totalMs = 0, startTs = null, baseMs = 0, rafId = null;
  let state = 'idle'; // idle | running | paused | done

  function fmt(ms) {
    const t = Math.ceil(Math.max(0, ms) / 1000);
    return `${String(Math.floor(t / 60)).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
  }

  function tick(now) {
    const elapsed   = baseMs + (now - startTs);
    const remaining = totalMs - elapsed;
    if (remaining <= 0) {
      setSector(0);
      timeDisplay.textContent = '00:00';
      onDone();
      return;
    }
    setSector(remaining / totalMs);
    timeDisplay.textContent = fmt(remaining);
    rafId = requestAnimationFrame(tick);
  }

  function onDone() {
    cancelAnimationFrame(rafId);
    state = 'done';
    wrap.classList.add('done');
    statusEl.textContent = '完了！';
    startBtn.textContent = 'もう一度';
  }

  function startOrPause() {
    if (state === 'idle' || state === 'done') {
      wrap.classList.remove('done');
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value)  || 0;
      totalMs = (m * 60 + s) * 1000;
      if (!totalMs) return;
      baseMs = 0;
      state  = 'running';
      startBtn.textContent = '一時停止';
      statusEl.textContent = '計測中';
      setSector(1);
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });

    } else if (state === 'running') {
      cancelAnimationFrame(rafId);
      baseMs += performance.now() - startTs;
      state = 'paused';
      startBtn.textContent = '再開';
      statusEl.textContent = '一時停止中';

    } else if (state === 'paused') {
      state = 'running';
      startBtn.textContent = '一時停止';
      statusEl.textContent = '計測中';
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });
    }
  }

  function reset() {
    cancelAnimationFrame(rafId);
    baseMs = 0; startTs = null; state = 'idle';
    wrap.classList.remove('done');
    startBtn.textContent = 'スタート';
    statusEl.textContent = '準備完了';
    setSector(1);
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    timeDisplay.textContent = fmt((m * 60 + s) * 1000);
  }

  function onInputChange() {
    if (state !== 'idle') return;
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    timeDisplay.textContent = fmt((m * 60 + s) * 1000);
  }

  startBtn.addEventListener('click', startOrPause);
  resetBtn.addEventListener('click', reset);
  minInput.addEventListener('input', onInputChange);
  secInput.addEventListener('input', onInputChange);

  // Init
  setSector(1);
  onInputChange();
</script>
</body>
</html>
