<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #EDE8E1;
    font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
    color: #2A2420;
    transition: background 1.2s ease;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ── Clock ── */
  .clock-outer {
    position: relative;
    width: 300px;
    height: 300px;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.09));
  }

  #clockSvg { width: 300px; height: 300px; }

  .center-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .time-text {
    font-size: 54px;
    font-weight: 200;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    color: #2A2420;
    transition: color 0.4s;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 300px;
  }

  /* Preset buttons */
  .presets {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .preset-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 50px;
    border: 1.5px solid #C4BDB5;
    background: transparent;
    color: #6A6059;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: all 0.18s;
  }
  .preset-btn:hover {
    border-color: #3E5A4C;
    color: #3E5A4C;
  }
  .preset-btn.active {
    background: #3E5A4C;
    border-color: #3E5A4C;
    color: #FAF7F3;
  }

  /* Custom time input — flat underline style */
  .custom-row {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    color: #A89E96;
    font-size: 12px;
  }

  .custom-row input {
    width: 42px;
    background: none;
    border: none;
    border-bottom: 1.5px solid #C4BDB5;
    color: #2A2420;
    font-size: 24px;
    font-weight: 300;
    text-align: center;
    padding: 0 0 3px;
    outline: none;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
    transition: border-color 0.2s;
  }
  .custom-row input::-webkit-inner-spin-button,
  .custom-row input::-webkit-outer-spin-button { display: none; }
  .custom-row input:focus { border-color: #3E5A4C; }

  .custom-row .unit {
    font-size: 12px;
    color: #A89E96;
    padding-bottom: 5px;
    margin-left: 1px;
  }
  .custom-row .colon {
    font-size: 20px;
    font-weight: 200;
    color: #C4BDB5;
    padding-bottom: 3px;
    margin: 0 4px;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  #startBtn {
    flex: 1;
    padding: 13px 0;
    border-radius: 50px;
    border: none;
    background: #3E5A4C;
    color: #FAF7F3;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.35s, opacity 0.15s, transform 0.1s;
  }

  #resetBtn {
    padding: 13px 22px;
    border-radius: 50px;
    border: none;
    background: #DDD7CF;
    color: #5A524A;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  button:hover  { opacity: 0.82; }
  button:active { transform: scale(0.96); }

  /* Done state */
  .done #startBtn           { background: #A85A42; }
  .done .time-text          { color: #A85A42; }
  .done .preset-btn.active  { background: #A85A42; border-color: #A85A42; }

  /* ── Total time ── */
  .total-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 300px;
    padding: 14px 20px;
    background: rgba(255,255,255,0.55);
    border-radius: 16px;
    border: 1px solid #DDD7CF;
  }

  .total-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .total-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #A89E96;
    font-weight: 500;
  }

  .total-value {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #2A2420;
    font-variant-numeric: tabular-nums;
  }

  .total-clear {
    font-size: 11px;
    color: #C4BDB5;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    letter-spacing: 0.5px;
    transition: color 0.2s;
    font-weight: 400;
  }
  .total-clear:hover  { color: #A85A42; opacity: 1; }
  .total-clear:active { transform: none; }
</style>
</head>
<body>

<div class="wrap" id="wrap">

  <!-- Clock -->
  <div class="clock-outer">
    <svg id="clockSvg" viewBox="0 0 300 300">
      <!-- White face -->
      <circle cx="150" cy="150" r="148" fill="white"/>

      <!-- Track ring (full circle, light) -->
      <circle cx="150" cy="150" r="116"
              fill="none" stroke="#E4DDD6" stroke-width="32"
              transform="rotate(-90 150 150)"/>

      <!-- Remaining ring (dynamic path) -->
      <path id="ring"
            fill="none" stroke="#3E5A4C" stroke-width="32"
            stroke-linecap="round"/>

      <!-- 12 o'clock dot (fixed anchor) -->
      <circle id="anchorDot" cx="150" cy="34" r="6" fill="#3E5A4C"/>

      <!-- Subtle face border -->
      <circle cx="150" cy="150" r="148" fill="none" stroke="#DDD7CF" stroke-width="1"/>
    </svg>

    <div class="center-text">
      <div class="time-text" id="timeText">05:00</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">

    <!-- Preset buttons -->
    <div class="presets">
      <button class="preset-btn" data-min="10" data-sec="0">10分</button>
      <button class="preset-btn" data-min="25" data-sec="0">25分</button>
      <button class="preset-btn" data-min="60" data-sec="0">60分</button>
    </div>

    <!-- Custom input (flat underline) -->
    <div class="custom-row">
      <input type="number" id="minInput" value="5" min="0" max="99" inputmode="numeric"/>
      <span class="unit">分</span>
      <span class="colon">:</span>
      <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric"/>
      <span class="unit">秒</span>
    </div>

    <!-- Action buttons -->
    <div class="actions">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>

  </div>

  <!-- Total time -->
  <div class="total-box">
    <div class="total-left">
      <span class="total-label">合計時間</span>
      <span class="total-value" id="totalValue">0分</span>
    </div>
    <button class="total-clear" id="totalClear">クリア</button>
  </div>

</div>

<script>
  // ── Accumulated total (localStorage) ─────────────────────────
  const STORAGE_KEY = 'circleTimerTotalSec';
  const totalValueEl = document.getElementById('totalValue');
  const totalClearEl = document.getElementById('totalClear');

  function loadTotal() {
    return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
  }

  function saveTotal(sec) {
    localStorage.setItem(STORAGE_KEY, String(sec));
  }

  function fmtTotal(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0)  return `${h}時間 ${m}分`;
    if (m > 0)  return `${m}分 ${s}秒`;
    return `${s}秒`;
  }

  function renderTotal() {
    totalValueEl.textContent = fmtTotal(loadTotal());
  }

  function addToTotal(ms) {
    const sec = Math.round(ms / 1000);
    saveTotal(loadTotal() + sec);
    renderTotal();
  }

  totalClearEl.addEventListener('click', () => {
    if (!confirm('合計時間をクリアしますか？')) return;
    saveTotal(0);
    renderTotal();
  });

  // ──────────────────────────────────────────────────────────────
  const CX = 150, CY = 150, R = 116;
  const ringEl     = document.getElementById('ring');
  const anchorDot  = document.getElementById('anchorDot');
  const timeText   = document.getElementById('timeText');
  const startBtn   = document.getElementById('startBtn');
  const resetBtn   = document.getElementById('resetBtn');
  const minInput   = document.getElementById('minInput');
  const secInput   = document.getElementById('secInput');
  const wrap       = document.getElementById('wrap');
  const presetBtns = document.querySelectorAll('.preset-btn');

  // ── Ring drawing ──────────────────────────────────────────────
  // 右回転: elapsed area grows clockwise from 12.
  // Ring (remaining) goes from [elapsed_angle] clockwise to 12 o'clock.
  // As elapsed grows, elapsed_angle moves clockwise → ring start moves clockwise.

  function setRing(remainingFraction) {
    const f       = Math.max(0, Math.min(1, remainingFraction));
    const elapsed = 1 - f;
    // Angle of the ring's start (pointer): clockwise from 12 o'clock
    const pAngle  = -Math.PI / 2 + elapsed * 2 * Math.PI;
    const px      = CX + R * Math.cos(pAngle);
    const py      = CY + R * Math.sin(pAngle);
    const ex      = CX;      // 12 o'clock x
    const ey      = CY - R;  // 12 o'clock y

    // Update anchor dot visibility
    anchorDot.style.opacity = f > 0.001 ? '1' : '0';

    if (f >= 0.9999) {
      // Full circle: two semicircles
      ringEl.setAttribute('d',
        `M ${CX} ${CY - R} A ${R} ${R} 0 1 1 ${CX} ${CY + R} A ${R} ${R} 0 1 1 ${CX} ${CY - R}`
      );
      return;
    }
    if (f <= 0.0001) {
      ringEl.setAttribute('d', '');
      return;
    }

    // Arc from pointer (clockwise from 12) → 12 o'clock, going clockwise
    const largeArc = f > 0.5 ? 1 : 0;
    ringEl.setAttribute('d',
      `M ${px} ${py} A ${R} ${R} 0 ${largeArc} 1 ${ex} ${ey}`
    );
  }

  // ── Background color ──────────────────────────────────────────
  const BG_NORMAL = '#EDE8E1';
  const BG_WARN   = '#F5EDD0'; // 残り25%：やわらかい黄
  const BG_ALERT  = '#F0D5CC'; // 残り10%：やわらかい赤

  function updateBg(fraction) {
    const f = Math.max(0, fraction);
    const bg = f <= 0.10 ? BG_ALERT : f <= 0.25 ? BG_WARN : BG_NORMAL;
    if (document.body.style.background !== bg) document.body.style.background = bg;
  }

  // ── Timer state ───────────────────────────────────────────────
  let totalMs = 0, startTs = null, baseMs = 0, rafId = null;
  let state = 'idle'; // idle | running | paused | done

  function fmt(ms) {
    const t = Math.ceil(Math.max(0, ms) / 1000);
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  }

  function tick(now) {
    const elapsed   = baseMs + (now - startTs);
    const remaining = totalMs - elapsed;
    if (remaining <= 0) {
      setRing(0);
      timeText.textContent = '00:00';
      onDone();
      return;
    }
    const frac = remaining / totalMs;
    setRing(frac);
    updateBg(frac);
    timeText.textContent = fmt(remaining);
    rafId = requestAnimationFrame(tick);
  }

  function onDone() {
    cancelAnimationFrame(rafId);
    state = 'done';
    wrap.classList.add('done');
    startBtn.textContent = 'もう一度';
    addToTotal(totalMs); // 完了したセッションを合計に加算
  }

  function startOrPause() {
    if (state === 'idle' || state === 'done') {
      wrap.classList.remove('done');
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value)  || 0;
      totalMs = (m * 60 + s) * 1000;
      if (!totalMs) return;
      baseMs = 0;
      state  = 'running';
      startBtn.textContent = '一時停止';
      setRing(1);
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });

    } else if (state === 'running') {
      cancelAnimationFrame(rafId);
      baseMs += performance.now() - startTs;
      state = 'paused';
      startBtn.textContent = '再開';

    } else if (state === 'paused') {
      state = 'running';
      startBtn.textContent = '一時停止';
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });
    }
  }

  function reset() {
    cancelAnimationFrame(rafId);
    baseMs = 0; startTs = null; state = 'idle';
    wrap.classList.remove('done');
    startBtn.textContent = 'スタート';
    setRing(1);
    updateBg(1);
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    timeText.textContent = fmt((m * 60 + s) * 1000);
  }

  function applyTime(min, sec) {
    minInput.value = min;
    secInput.value = sec;
    if (state === 'idle') {
      timeText.textContent = fmt((min * 60 + sec) * 1000);
      setRing(1);
    }
    refreshPresetActive();
  }

  function refreshPresetActive() {
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    presetBtns.forEach(btn => {
      const match = parseInt(btn.dataset.min) === m && parseInt(btn.dataset.sec) === s;
      btn.classList.toggle('active', match);
    });
  }

  startBtn.addEventListener('click', startOrPause);
  resetBtn.addEventListener('click', reset);

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      applyTime(parseInt(btn.dataset.min), parseInt(btn.dataset.sec));
      if (state !== 'idle') reset();
    });
  });

  minInput.addEventListener('input', () => {
    if (state === 'idle') {
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value)  || 0;
      timeText.textContent = fmt((m * 60 + s) * 1000);
      refreshPresetActive();
    }
  });

  secInput.addEventListener('input', () => {
    if (state === 'idle') {
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value)  || 0;
      timeText.textContent = fmt((m * 60 + s) * 1000);
      refreshPresetActive();
    }
  });

  // Init
  setRing(1);
  refreshPresetActive();
  renderTotal();
  timeText.textContent = fmt((parseInt(minInput.value) * 60 + parseInt(secInput.value)) * 1000);
</script>
</body>
</html>
