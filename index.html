<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<link rel="icon" type="image/png" id="dynamicFavicon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #EDE8E1;
  font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
  color: #2A2420;
  transition: background 1.2s ease;
}

/* ═══════════════════════════════════════════
   HAMBURGER BUTTON
═══════════════════════════════════════════ */
.menu-btn {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 42px;
  height: 42px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border-radius: 13px;
  border: 1px solid rgba(0,0,0,0.07);
  box-shadow: 0 2px 14px rgba(0,0,0,0.09);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  z-index: 200;
  transition: box-shadow 0.2s, transform 0.15s;
}
.menu-btn:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.13); }
.menu-btn:active { transform: scale(0.95); }
.menu-btn span {
  display: block;
  width: 18px;
  height: 1.5px;
  background: #3A3530;
  border-radius: 2px;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

/* ═══════════════════════════════════════════
   CALENDAR OVERLAY + PANEL
═══════════════════════════════════════════ */
.cal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(30,24,20,0);
  z-index: 150;
  pointer-events: none;
  transition: background 0.32s ease;
}
.cal-overlay.open {
  background: rgba(30,24,20,0.28);
  pointer-events: auto;
}

.cal-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: 360px;
  max-width: 100vw;
  height: 100%;
  background: #FDFAF6;
  box-shadow: -8px 0 40px rgba(0,0,0,0.12);
  transform: translateX(100%);
  transition: transform 0.36s cubic-bezier(0.4,0,0.2,1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-overlay.open .cal-panel {
  transform: translateX(0);
}

/* Panel header */
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 22px 14px;
  border-bottom: 1px solid #EDE8E1;
}
.cal-head h2 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: #2A2420;
}
.cal-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: #EDE8E1;
  color: #7A7068;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.18s;
}
.cal-close:hover { background: #DDD7CF; }

/* Summary stats */
.cal-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 16px 22px;
  border-bottom: 1px solid #EDE8E1;
}
.cal-stat {
  background: #F5F0EB;
  border-radius: 12px;
  padding: 12px 14px;
}
.stat-label {
  display: block;
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: #A89E96;
  font-weight: 500;
  margin-bottom: 4px;
}
.stat-value {
  display: block;
  font-size: 20px;
  font-weight: 300;
  color: #2A2420;
  font-variant-numeric: tabular-nums;
}

/* Month navigation */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 8px;
}
.cal-nav-arrow {
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  border-radius: 8px;
  color: #7A7068;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.cal-nav-arrow:hover { background: #EDE8E1; color: #2A2420; }
.cal-month-label {
  font-size: 15px;
  font-weight: 500;
  color: #2A2420;
  letter-spacing: 0.3px;
}

/* Weekday headers */
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0 14px 6px;
  text-align: center;
}
.cal-weekdays span {
  font-size: 11px;
  color: #B0A8A0;
  font-weight: 500;
  letter-spacing: 0.5px;
  padding: 4px 0;
}
.cal-weekdays span:first-child { color: #C49090; } /* 日 */
.cal-weekdays span:last-child  { color: #9090C4; } /* 土 */

/* Calendar grid */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  padding: 0 14px;
  flex: 1;
  align-content: start;
}

.cal-day {
  aspect-ratio: 1;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: default;
  position: relative;
  transition: transform 0.12s;
}
.cal-day:hover { transform: scale(1.06); }

.cal-day .day-num {
  font-size: 13px;
  font-weight: 400;
  color: #2A2420;
  line-height: 1;
}
.cal-day .day-time {
  font-size: 9px;
  font-weight: 500;
  color: #7A9E8A;
  line-height: 1;
  letter-spacing: 0.2px;
}

/* Intensity levels */
.cal-day.lv0 { background: transparent; }
.cal-day.lv1 { background: #D6EAE0; }
.cal-day.lv1 .day-num { color: #2A6040; }
.cal-day.lv1 .day-time { color: #4A8060; }
.cal-day.lv2 { background: #A3CCBA; }
.cal-day.lv2 .day-num { color: #1A4530; }
.cal-day.lv2 .day-time { color: #1A4530; }
.cal-day.lv3 { background: #6DAE90; }
.cal-day.lv3 .day-num { color: #FAF7F3; }
.cal-day.lv3 .day-time { color: #EAF5EF; }
.cal-day.lv4 { background: #4A876C; }
.cal-day.lv4 .day-num { color: #FAF7F3; }
.cal-day.lv4 .day-time { color: #C5E0D4; }
.cal-day.lv5 { background: #3E5A4C; }
.cal-day.lv5 .day-num { color: #FAF7F3; }
.cal-day.lv5 .day-time { color: #A8CAB8; }

/* Today highlight */
.cal-day.today::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 10px;
  border: 2px solid #3E5A4C;
  pointer-events: none;
}
.cal-day.lv3.today::after,
.cal-day.lv4.today::after,
.cal-day.lv5.today::after { border-color: rgba(255,255,255,0.6); }

/* Outside current month */
.cal-day.other-month .day-num { color: #C8C2B8; }
.cal-day.other-month { opacity: 0.45; }

/* Legend */
.cal-legend {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 22px 20px;
  justify-content: flex-end;
}
.cal-legend span {
  font-size: 10px;
  color: #B0A8A0;
  letter-spacing: 0.5px;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 4px;
}

/* ═══════════════════════════════════════════
   MAIN TIMER
═══════════════════════════════════════════ */
.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

.clock-outer {
  position: relative;
  width: 300px;
  height: 300px;
  filter: drop-shadow(0 6px 24px rgba(0,0,0,0.09));
}
#clockSvg { width: 300px; height: 300px; }

.center-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.time-text {
  font-size: 54px;
  font-weight: 200;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  color: #2A2420;
  transition: color 0.4s;
}

/* Controls */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  width: 300px;
}

.presets {
  display: flex;
  gap: 8px;
  width: 100%;
}
.preset-btn {
  flex: 1;
  padding: 10px 0;
  border-radius: 50px;
  border: 1.5px solid #C4BDB5;
  background: transparent;
  color: #6A6059;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
}
.preset-btn:hover { border-color: #3E5A4C; color: #3E5A4C; }
.preset-btn.active { background: #3E5A4C; border-color: #3E5A4C; color: #FAF7F3; }

.custom-row {
  display: flex;
  align-items: flex-end;
  gap: 4px;
}
.custom-row input {
  width: 42px;
  background: none;
  border: none;
  border-bottom: 1.5px solid #C4BDB5;
  color: #2A2420;
  font-size: 24px;
  font-weight: 300;
  text-align: center;
  padding: 0 0 3px;
  outline: none;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
  transition: border-color 0.2s;
}
.custom-row input::-webkit-inner-spin-button,
.custom-row input::-webkit-outer-spin-button { display: none; }
.custom-row input:focus { border-color: #3E5A4C; }
.custom-row .unit { font-size: 12px; color: #A89E96; padding-bottom: 5px; margin-left: 1px; }
.custom-row .colon { font-size: 20px; font-weight: 200; color: #C4BDB5; padding-bottom: 3px; margin: 0 4px; }

.actions { display: flex; gap: 10px; width: 100%; }
#startBtn {
  flex: 1;
  padding: 13px 0;
  border-radius: 50px;
  border: none;
  background: #3E5A4C;
  color: #FAF7F3;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background 0.35s, opacity 0.15s, transform 0.1s;
}
#resetBtn {
  padding: 13px 22px;
  border-radius: 50px;
  border: none;
  background: #DDD7CF;
  color: #5A524A;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
button:hover  { opacity: 0.82; }
button:active { transform: scale(0.96); }
.menu-btn:active,
.cal-close:active,
.cal-nav-arrow:active { transform: scale(0.95) !important; }

/* Today's total card */
.today-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 300px;
  padding: 14px 20px;
  background: rgba(255,255,255,0.55);
  border-radius: 16px;
  border: 1px solid #DDD7CF;
}
.today-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.today-label {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #A89E96;
  font-weight: 500;
}
.today-value {
  font-size: 22px;
  font-weight: 300;
  color: #2A2420;
  font-variant-numeric: tabular-nums;
}
.today-clear {
  font-size: 11px;
  color: #C4BDB5;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  letter-spacing: 0.5px;
  transition: color 0.2s;
}
.today-clear:hover { color: #A85A42; opacity: 1; }
.today-clear:active { transform: none !important; }

/* Done state */
.done #startBtn          { background: #A85A42; }
.done .time-text         { color: #A85A42; }
.done .preset-btn.active { background: #A85A42; border-color: #A85A42; }
</style>
</head>
<body>

<!-- Hamburger -->
<button class="menu-btn" id="menuBtn" aria-label="カレンダーを開く">
  <span></span><span></span><span></span>
</button>

<!-- Calendar overlay -->
<div class="cal-overlay" id="calOverlay">
  <div class="cal-panel" id="calPanel">

    <div class="cal-head">
      <h2>学習カレンダー</h2>
      <button class="cal-close" id="calClose">✕</button>
    </div>

    <div class="cal-stats">
      <div class="cal-stat">
        <span class="stat-label">今月の合計</span>
        <span class="stat-value" id="statMonthTotal">—</span>
      </div>
      <div class="cal-stat">
        <span class="stat-label">学習した日</span>
        <span class="stat-value" id="statStudyDays">—</span>
      </div>
    </div>

    <div class="cal-nav">
      <button class="cal-nav-arrow" id="prevMonth">&#8249;</button>
      <span class="cal-month-label" id="monthLabel"></span>
      <button class="cal-nav-arrow" id="nextMonth">&#8250;</button>
    </div>

    <div class="cal-weekdays">
      <span>日</span><span>月</span><span>火</span>
      <span>水</span><span>木</span><span>金</span><span>土</span>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-legend">
      <span>少</span>
      <div class="legend-dot" style="background:#D6EAE0"></div>
      <div class="legend-dot" style="background:#A3CCBA"></div>
      <div class="legend-dot" style="background:#6DAE90"></div>
      <div class="legend-dot" style="background:#4A876C"></div>
      <div class="legend-dot" style="background:#3E5A4C"></div>
      <span>多</span>
    </div>

  </div>
</div>

<!-- Main timer -->
<div class="wrap" id="wrap">

  <div class="clock-outer">
    <svg id="clockSvg" viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="148" fill="white"/>
      <circle cx="150" cy="150" r="116"
              fill="none" stroke="#E4DDD6" stroke-width="32"
              transform="rotate(-90 150 150)"/>
      <path id="ring" fill="none" stroke="#3E5A4C" stroke-width="32" stroke-linecap="round"/>
      <circle id="anchorDot" cx="150" cy="34" r="6" fill="#3E5A4C"/>
      <circle cx="150" cy="150" r="148" fill="none" stroke="#DDD7CF" stroke-width="1"/>
    </svg>
    <div class="center-text">
      <div class="time-text" id="timeText">05:00</div>
    </div>
  </div>

  <div class="controls">
    <div class="presets">
      <button class="preset-btn" data-min="10" data-sec="0">10分</button>
      <button class="preset-btn" data-min="25" data-sec="0">25分</button>
      <button class="preset-btn" data-min="60" data-sec="0">60分</button>
    </div>
    <div class="custom-row">
      <input type="number" id="minInput" value="5" min="0" max="99" inputmode="numeric"/>
      <span class="unit">分</span>
      <span class="colon">:</span>
      <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric"/>
      <span class="unit">秒</span>
    </div>
    <div class="actions">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>

  <div class="today-box">
    <div class="today-left">
      <span class="today-label">今日の学習</span>
      <span class="today-value" id="todayValue">0分</span>
    </div>
    <button class="today-clear" id="todayClear">クリア</button>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
// DATA — localStorage (per-day history)
// ═══════════════════════════════════════════
const HISTORY_KEY = 'circleTimerDays';

function dateKey(d) {
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); }
  catch { return {}; }
}

function saveHistory(h) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}

function addSeconds(sec) {
  const h = loadHistory();
  const k = dateKey();
  h[k] = (h[k] || 0) + sec;
  saveHistory(h);
  renderTodayBox();
}

function clearToday() {
  const h = loadHistory();
  delete h[dateKey()];
  saveHistory(h);
  renderTodayBox();
}

// ── Format helpers ───────────────────────
function fmtDur(sec) {
  if (!sec || sec <= 0) return '0分';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return m > 0 ? `${h}時間${m}分` : `${h}時間`;
  if (m > 0) return s > 0 ? `${m}分${s}秒` : `${m}分`;
  return `${s}秒`;
}

function fmtDurShort(sec) {
  if (!sec || sec <= 0) return '';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}h${m > 0 ? m+'m' : ''}`;
  if (m > 0) return `${m}分`;
  return `${sec}秒`;
}

function intensityLevel(sec) {
  if (!sec || sec <= 0) return 0;
  if (sec <  900) return 1;   // < 15min
  if (sec < 1800) return 2;   // 15–30min
  if (sec < 3600) return 3;   // 30–60min
  if (sec < 7200) return 4;   // 1–2h
  return 5;                   // 2h+
}

// ── Today's box ──────────────────────────
function renderTodayBox() {
  const h = loadHistory();
  const sec = h[dateKey()] || 0;
  document.getElementById('todayValue').textContent = fmtDur(sec);
}

document.getElementById('todayClear').addEventListener('click', () => {
  if (!confirm('今日の学習記録をクリアしますか？')) return;
  clearToday();
});

// ═══════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════
let calYear, calMonth;

function openCalendar() {
  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
  document.getElementById('calOverlay').classList.add('open');
  document.getElementById('menuBtn').classList.add('open');
}

function closeCalendar() {
  document.getElementById('calOverlay').classList.remove('open');
  document.getElementById('menuBtn').classList.remove('open');
}

document.getElementById('menuBtn').addEventListener('click', () => {
  const isOpen = document.getElementById('calOverlay').classList.contains('open');
  isOpen ? closeCalendar() : openCalendar();
});
document.getElementById('calClose').addEventListener('click', closeCalendar);
document.getElementById('calOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('calOverlay')) closeCalendar();
});

document.getElementById('prevMonth').addEventListener('click', () => {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

function renderCalendar() {
  const h     = loadHistory();
  const today = dateKey();
  const now   = new Date();

  // Month label
  document.getElementById('monthLabel').textContent =
    `${calYear}年${calMonth + 1}月`;

  // Stats for this month
  let monthSec = 0, studyDays = 0;
  Object.entries(h).forEach(([k, v]) => {
    const d = new Date(k + 'T00:00:00');
    if (d.getFullYear() === calYear && d.getMonth() === calMonth) {
      monthSec += v;
      studyDays++;
    }
  });
  document.getElementById('statMonthTotal').textContent = fmtDur(monthSec);
  document.getElementById('statStudyDays').textContent  = `${studyDays}日`;

  // Build grid
  const grid  = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();

  // Leading days from previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = makeCell(prevDays - i, calYear, calMonth - 1, false, false, 0);
    cell.classList.add('other-month');
    grid.appendChild(cell);
  }

  // Days of current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dt  = new Date(calYear, calMonth, d);
    const key = dateKey(dt);
    const sec = h[key] || 0;
    const isToday = key === today;
    const cell = makeCell(d, calYear, calMonth, true, isToday, sec);
    grid.appendChild(cell);
  }

  // Trailing days from next month
  const totalCells = firstDay + daysInMonth;
  const trailingCount = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= trailingCount; d++) {
    const cell = makeCell(d, calYear, calMonth + 1, false, false, 0);
    cell.classList.add('other-month');
    grid.appendChild(cell);
  }
}

function makeCell(day, year, month, inMonth, isToday, sec) {
  const cell = document.createElement('div');
  cell.className = `cal-day lv${inMonth ? intensityLevel(sec) : 0}`;
  if (isToday) cell.classList.add('today');

  const numEl = document.createElement('span');
  numEl.className = 'day-num';
  numEl.textContent = day;
  cell.appendChild(numEl);

  if (inMonth && sec > 0) {
    const timeEl = document.createElement('span');
    timeEl.className = 'day-time';
    timeEl.textContent = fmtDurShort(sec);
    cell.appendChild(timeEl);
  }

  return cell;
}

// ═══════════════════════════════════════════
// RING DRAWING
// ═══════════════════════════════════════════
const CX = 150, CY = 150, R = 116;
const ringEl    = document.getElementById('ring');
const anchorDot = document.getElementById('anchorDot');

function setRing(f) {
  f = Math.max(0, Math.min(1, f));
  const elapsed = 1 - f;
  const pAngle  = -Math.PI / 2 + elapsed * 2 * Math.PI;
  const px = CX + R * Math.cos(pAngle);
  const py = CY + R * Math.sin(pAngle);
  const ex = CX, ey = CY - R;

  anchorDot.style.opacity = f > 0.001 ? '1' : '0';

  if (f >= 0.9999) {
    ringEl.setAttribute('d',
      `M ${CX} ${CY-R} A ${R} ${R} 0 1 1 ${CX} ${CY+R} A ${R} ${R} 0 1 1 ${CX} ${CY-R}`);
    return;
  }
  if (f <= 0.0001) { ringEl.setAttribute('d', ''); return; }

  const largeArc = f > 0.5 ? 1 : 0;
  ringEl.setAttribute('d', `M ${px} ${py} A ${R} ${R} 0 ${largeArc} 1 ${ex} ${ey}`);
}

// ═══════════════════════════════════════════
// BACKGROUND
// ═══════════════════════════════════════════
const BG_NORMAL = '#EDE8E1';
const BG_WARN   = '#F5EDD0';
const BG_ALERT  = '#F0D5CC';

function updateBg(f) {
  const bg = f <= 0.10 ? BG_ALERT : f <= 0.25 ? BG_WARN : BG_NORMAL;
  if (document.body.style.background !== bg) document.body.style.background = bg;
}

// ═══════════════════════════════════════════
// FAVICON + TAB TITLE
// ═══════════════════════════════════════════
const _fvCanvas = document.createElement('canvas');
_fvCanvas.width = _fvCanvas.height = 128;
const _fvCtx    = _fvCanvas.getContext('2d');
const _fvLink   = document.getElementById('dynamicFavicon');
let   _fvBlobUrl = null;
let   _fvLastSec = -1;

function drawFavicon(remainingMs, total, st) {
  const S = 128, cx = 64, cy = 64, r = 50, sw = 14;
  _fvCtx.clearRect(0, 0, S, S);

  // Background circle
  _fvCtx.beginPath();
  _fvCtx.arc(cx, cy, 64, 0, Math.PI * 2);
  _fvCtx.fillStyle = '#1C2E26';
  _fvCtx.fill();

  const frac    = (total > 0) ? Math.max(0, Math.min(1, remainingMs / total)) : 1;
  const elapsed = 1 - frac;

  // Track ring (dim)
  _fvCtx.beginPath();
  _fvCtx.arc(cx, cy, r, 0, Math.PI * 2);
  _fvCtx.strokeStyle = 'rgba(255,255,255,0.14)';
  _fvCtx.lineWidth = sw;
  _fvCtx.stroke();

  // Remaining arc — start angle moves clockwise, same logic as main ring
  const ringColor = st === 'done' ? '#E87B5A' : '#52D9A8';
  if (frac > 0.001) {
    _fvCtx.beginPath();
    if (frac >= 0.999) {
      _fvCtx.arc(cx, cy, r, -Math.PI / 2, Math.PI * 1.5, false);
    } else {
      const startAngle = -Math.PI / 2 + elapsed * 2 * Math.PI;
      _fvCtx.arc(cx, cy, r, startAngle, -Math.PI / 2, false);
    }
    _fvCtx.strokeStyle = ringColor;
    _fvCtx.lineWidth   = sw;
    _fvCtx.lineCap     = 'round';
    _fvCtx.stroke();
  }

  // Center label
  let label, fontSize;
  if (st === 'done') {
    label = '✓'; fontSize = 48;
  } else if (st === 'idle' || total <= 0) {
    label = ''; // idle: ring only, no text
  } else {
    const sec = Math.max(0, Math.ceil(remainingMs / 1000));
    const m   = Math.floor(sec / 60);
    const s   = sec % 60;
    label    = `${m}:${String(s).padStart(2, '0')}`;
    fontSize = label.length > 4 ? 22 : 27;
  }

  if (label) {
    _fvCtx.font         = `700 ${fontSize}px -apple-system, "Helvetica Neue", monospace`;
    _fvCtx.fillStyle    = '#FFFFFF';
    _fvCtx.textAlign    = 'center';
    _fvCtx.textBaseline = 'middle';
    _fvCtx.fillText(label, cx, cy + 1);
  }

  // Use Blob URL (avoids potential data: CSP issues)
  _fvCanvas.toBlob(blob => {
    const newUrl = URL.createObjectURL(blob);
    _fvLink.href = newUrl;
    if (_fvBlobUrl) URL.revokeObjectURL(_fvBlobUrl);
    _fvBlobUrl = newUrl;
  }, 'image/png');
}

function updateTab(remainingMs, total, st) {
  const sec = Math.ceil(Math.max(0, remainingMs) / 1000);
  if (sec === _fvLastSec && st !== 'done' && st !== 'idle') return; // throttle
  _fvLastSec = sec;

  drawFavicon(remainingMs, total, st);

  // Tab title
  if (st === 'idle') {
    document.title = 'Circle Timer';
  } else if (st === 'done') {
    document.title = '✓ 完了 | Circle Timer';
  } else {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const prefix = st === 'paused' ? '⏸' : '⏱';
    document.title = `${prefix} ${m}:${String(s).padStart(2,'0')} | Circle Timer`;
  }
}

// ═══════════════════════════════════════════
// TIMER STATE
// ═══════════════════════════════════════════
const timeText   = document.getElementById('timeText');
const startBtn   = document.getElementById('startBtn');
const resetBtn   = document.getElementById('resetBtn');
const minInput   = document.getElementById('minInput');
const secInput   = document.getElementById('secInput');
const wrap       = document.getElementById('wrap');
const presetBtns = document.querySelectorAll('.preset-btn');

let totalMs = 0, startTs = null, baseMs = 0, rafId = null;
let state = 'idle';

function fmt(ms) {
  const t = Math.ceil(Math.max(0, ms) / 1000);
  return `${String(Math.floor(t / 60)).padStart(2,'0')}:${String(t % 60).padStart(2,'0')}`;
}

function tick(now) {
  const elapsed   = baseMs + (now - startTs);
  const remaining = totalMs - elapsed;
  if (remaining <= 0) {
    setRing(0); updateBg(0);
    timeText.textContent = '00:00';
    onDone();
    return;
  }
  const frac = remaining / totalMs;
  setRing(frac);
  updateBg(frac);
  updateTab(remaining, totalMs, 'running');
  timeText.textContent = fmt(remaining);
  rafId = requestAnimationFrame(tick);
}

function onDone() {
  cancelAnimationFrame(rafId);
  state = 'done';
  wrap.classList.add('done');
  startBtn.textContent = 'もう一度';
  addSeconds(Math.round(totalMs / 1000));
  updateTab(0, totalMs, 'done');
}

function startOrPause() {
  if (state === 'idle' || state === 'done') {
    wrap.classList.remove('done');
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    totalMs = (m * 60 + s) * 1000;
    if (!totalMs) return;
    baseMs = 0; state = 'running';
    startBtn.textContent = '一時停止';
    setRing(1);
    rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });

  } else if (state === 'running') {
    cancelAnimationFrame(rafId);
    baseMs += performance.now() - startTs;
    state = 'paused';
    startBtn.textContent = '再開';
    const pausedRemaining = totalMs - baseMs;
    updateTab(pausedRemaining, totalMs, 'paused');

  } else if (state === 'paused') {
    state = 'running';
    startBtn.textContent = '一時停止';
    _fvLastSec = -1; // force redraw on resume
    rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });
  }
}

function reset() {
  cancelAnimationFrame(rafId);
  baseMs = 0; startTs = null; state = 'idle';
  wrap.classList.remove('done');
  startBtn.textContent = 'スタート';
  setRing(1); updateBg(1);
  _fvLastSec = -1;
  updateTab(0, 0, 'idle');
  const m = parseInt(minInput.value) || 0;
  const s = parseInt(secInput.value)  || 0;
  timeText.textContent = fmt((m * 60 + s) * 1000);
}

function applyTime(min, sec) {
  minInput.value = min; secInput.value = sec;
  if (state === 'idle') { timeText.textContent = fmt((min*60+sec)*1000); setRing(1); }
  refreshPresetActive();
}

function refreshPresetActive() {
  const m = parseInt(minInput.value) || 0;
  const s = parseInt(secInput.value)  || 0;
  presetBtns.forEach(btn =>
    btn.classList.toggle('active',
      parseInt(btn.dataset.min) === m && parseInt(btn.dataset.sec) === s)
  );
}

startBtn.addEventListener('click', startOrPause);
resetBtn.addEventListener('click', reset);

presetBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    applyTime(parseInt(btn.dataset.min), parseInt(btn.dataset.sec));
    if (state !== 'idle') reset();
  });
});

minInput.addEventListener('input', () => {
  if (state === 'idle') {
    timeText.textContent = fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000);
    refreshPresetActive();
  }
});
secInput.addEventListener('input', () => {
  if (state === 'idle') {
    timeText.textContent = fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000);
    refreshPresetActive();
  }
});

// Init
setRing(1);
refreshPresetActive();
renderTodayBox();
updateTab(0, 0, 'idle');
timeText.textContent = fmt(((parseInt(minInput.value)||0)*60+(parseInt(secInput.value)||0))*1000);
</script>
</body>
</html>
