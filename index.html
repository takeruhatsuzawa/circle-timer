<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Timer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    color: #e6edf3;
    user-select: none;
  }

  .timer-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 44px;
  }

  /* --- Circle --- */
  .circle-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .circle-wrap svg {
    width: 300px;
    height: 300px;
    /* 12時スタートのため -90度回転 */
    transform: rotate(-90deg);
  }

  .track {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 12;
  }

  .ring {
    fill: none;
    stroke: #52d9a8;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke 0.4s;
  }

  /* --- Center display --- */
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .time-text {
    font-size: 56px;
    font-weight: 200;
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.4s;
  }

  .status-text {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    font-weight: 500;
  }

  /* --- Input section --- */
  .input-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .time-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .time-inputs input {
    width: 68px;
    padding: 9px 8px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #e6edf3;
    font-size: 22px;
    font-weight: 300;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  .time-inputs input::-webkit-inner-spin-button,
  .time-inputs input::-webkit-outer-spin-button { display: none; }

  .time-inputs input:focus { border-color: #52d9a8; }

  .time-inputs label {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
  }

  .colon {
    font-size: 26px;
    font-weight: 200;
    color: rgba(255,255,255,0.25);
    padding-bottom: 2px;
    margin: 0 2px;
  }

  /* --- Buttons --- */
  .buttons { display: flex; gap: 12px; }

  button {
    padding: 11px 32px;
    border-radius: 50px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.15s, transform 0.1s;
  }

  button:hover { opacity: 0.8; }
  button:active { transform: scale(0.96); }

  #startBtn {
    background: #52d9a8;
    color: #0d1117;
    min-width: 110px;
    transition: background 0.4s, color 0.4s;
  }

  #resetBtn {
    background: rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.65);
  }

  /* --- Done state --- */
  .done .ring      { stroke: #ff6b6b; }
  .done .time-text { color: #ff6b6b; }
  .done #startBtn  { background: #ff6b6b; color: #0d1117; }
</style>
</head>
<body>

<div class="timer-wrap" id="wrap">
  <div class="circle-wrap">
    <svg viewBox="0 0 300 300">
      <circle class="track" cx="150" cy="150" r="126"/>
      <circle class="ring"  cx="150" cy="150" r="126" id="ring"/>
    </svg>
    <div class="center">
      <div class="time-text" id="timeText">05:00</div>
      <div class="status-text" id="status">準備完了</div>
    </div>
  </div>

  <div class="input-section">
    <div class="time-inputs">
      <input type="number" id="minInput" value="5" min="0" max="99" inputmode="numeric"/>
      <label>分</label>
      <span class="colon">:</span>
      <input type="number" id="secInput" value="0" min="0" max="59" inputmode="numeric"/>
      <label>秒</label>
    </div>
    <div class="buttons">
      <button id="startBtn">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
  </div>
</div>

<script>
  const ring     = document.getElementById('ring');
  const timeText = document.getElementById('timeText');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const wrap     = document.getElementById('wrap');

  const R = 126;
  const C = 2 * Math.PI * R;

  ring.style.strokeDasharray  = C;
  ring.style.strokeDashoffset = 0;

  let totalMs = 0;
  let startTs = null;
  let baseMs  = 0;
  let rafId   = null;
  let state   = 'idle'; // idle | running | paused | done

  function fmt(ms) {
    const total = Math.ceil(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function setRing(fraction) {
    ring.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, fraction)));
  }

  function tick(now) {
    const elapsed   = baseMs + (now - startTs);
    const remaining = totalMs - elapsed;

    if (remaining <= 0) {
      setRing(0);
      timeText.textContent = '00:00';
      onDone();
      return;
    }

    setRing(remaining / totalMs);
    timeText.textContent = fmt(remaining);
    rafId = requestAnimationFrame(tick);
  }

  function onDone() {
    cancelAnimationFrame(rafId);
    state = 'done';
    wrap.classList.add('done');
    statusEl.textContent = '完了！';
    startBtn.textContent = 'もう一度';
  }

  function startOrPause() {
    if (state === 'idle' || state === 'done') {
      wrap.classList.remove('done');
      const m = parseInt(minInput.value) || 0;
      const s = parseInt(secInput.value)  || 0;
      totalMs = (m * 60 + s) * 1000;
      if (totalMs === 0) return;

      baseMs = 0;
      state  = 'running';
      startBtn.textContent = '一時停止';
      statusEl.textContent = '計測中';
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });

    } else if (state === 'running') {
      cancelAnimationFrame(rafId);
      baseMs += performance.now() - startTs;
      state = 'paused';
      startBtn.textContent = '再開';
      statusEl.textContent = '一時停止中';

    } else if (state === 'paused') {
      state = 'running';
      startBtn.textContent = '一時停止';
      statusEl.textContent = '計測中';
      rafId = requestAnimationFrame(ts => { startTs = ts; tick(ts); });
    }
  }

  function reset() {
    cancelAnimationFrame(rafId);
    baseMs  = 0;
    startTs = null;
    state   = 'idle';
    wrap.classList.remove('done');
    startBtn.textContent = 'スタート';
    statusEl.textContent = '準備完了';
    setRing(1);
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    timeText.textContent = fmt((m * 60 + s) * 1000);
  }

  function onInputChange() {
    if (state !== 'idle') return;
    const m = parseInt(minInput.value) || 0;
    const s = parseInt(secInput.value)  || 0;
    timeText.textContent = fmt((m * 60 + s) * 1000);
    setRing(1);
  }

  startBtn.addEventListener('click', startOrPause);
  resetBtn.addEventListener('click', reset);
  minInput.addEventListener('input', onInputChange);
  secInput.addEventListener('input', onInputChange);

  onInputChange();
</script>
</body>
</html>
